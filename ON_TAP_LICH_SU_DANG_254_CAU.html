 nghiệp hoá, hiện đại hoá, ứng dụng nhanh tiến bộ khoa học - công nghệ, đẩy mạnh phân công xã hội."],"correct":["B"],"warning":null},{"uid":"ch3-31","set":"ch3","sourceNo":31,"question":"Một trong những chủ trương của Đảng để tiếp tục hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là","choices":["hình thành và phát triển không đồng bộ các loại thị trường.","hình thành và phát triển đồng bộ các loại thị trường trong và ngoài nước.","hoàn thiện thể chế đảm bảo đồng bộ các yếu tố thị trường và phát triển đồng bộ các loại thị trường.","hình thành và phát triển đồng bộ các loại thị trường dịch vụ."],"correct":["C"],"warning":null},{"uid":"ch3-32","set":"ch3","sourceNo":32,"question":"Thuật ngữ “hệ thống chính trị” được Đảng ta sử dụng lần đầu tiên tại","choices":["Đại hội lần thứ IV (12/1976).","Đại hội lần thứ VI (12/1986).","Hội nghị Trung ương 6, Khóa VI (3/1989).","Đại hội lần thứ VII (6/1991)."],"correct":["C"],"warning":null},{"uid":"ch3-33","set":"ch3","sourceNo":33,"question":"Đảng ta khẳng định “Nhà nước xã hội chủ nghĩa Việt Nam là nhà nước chuyên chính vô sản” tại","choices":["Đại hội toàn quốc lần thứ IV (12/1976).","Hiến pháp nước Việt Nam Dân chủ Cộng hòa (1946).","Hiến pháp nước Cộng hòa Xã hội Chủ nghĩa Việt Nam (1980).","Đại hội Đảng lần thứ VI (12/1986)."],"correct":["C"],"warning":null},{"uid":"ch3-34","set":"ch3","sourceNo":34,"question":"Thuật ngữ “hệ thống chuyên chính vô sản” được Đảng bắt đầu sử dụng chính thức từ","choices":["Đại hội lần thứ I (3/1935).","Đại hội lần thứ III (9/1960).","Đại hội lần thứ IV (12/1976).","Đại hội lần thứ VI (12/1986)."],"correct":["C"],"warning":null},{"uid":"ch3-35","set":"ch3","sourceNo":35,"question":"Câu nói: “Một dân tộc dốt là một dân tộc yếu…” được Chủ tich Hồ Chí Minh nói vào A.","choices":["ngày 3/9/1945.","ngày 27/7/1947.","ngày 17/7/1965.","ngày 15/5/1965."],"correct":["A"],"warning":null},{"uid":"ch3-36","set":"ch3","sourceNo":36,"question":"Câu nói: “Non sông Việt Nam có trở iêu, vừa là động lực thúc đẩy phát triển kinh tế - xã hội."],"correct":["A"],"warning":null},{"uid":"ch3-41","set":"ch3","sourceNo":41,"question":"Điền vào chỗ trống: Xây dựng và phát triển văn hóa là sự nghiệp của toàn dân do Đảng lãnh đạo, trong đó…. giữ vai trò quan trọng.","choices":["giai cấp công nông.","giai cấp nông dân.","tầng lớp doanh nhân.","đội ngũ trí thức."],"correct":["D"],"warning":null},{"uid":"ch3-42","set":"ch3","sourceNo":42,"question":"Nội dung không đúng với chủ trương đối ngoại của Đảng đưa ra tại Đại hội VIII (1996) là","choices":["củng cố quan hệ với các nước láng giềng.","mở rộng quan hệ với các đảng cầm quyền và các đảng khác.","mở rộng quan hệ đối ngoại nhân dân, tổ chức phi chính phủ.","thử nghiệm để tiến tới thực hiện đầu tư ra nước ngoài."],"correct":["D"],"warning":null},{"uid":"ch3-43","set":"ch3","sourceNo":43,"question":"Nghị quyết đặt nền móng để hình thành đường lối đối ngoại độc lập tự chủ, rộng mở, đa phương hóa đa dạng hóa quan hệ quốc tế là","choices":["Nghị quyết Đại hội lần thứ V (3/1982).","Nghị quyết Đại hội lần thứ VI (12/1986).","Nghị quyết số 13 của Bộ chính trị (5/1988).","Nghị quyết Đại Hội lần thứ X (4/2006)."],"correct":["C"],"warning":null},{"uid":"ch3-44","set":"ch3","sourceNo":44,"question":"Quan điểm “Đoàn kết, hợp tác toàn diện với Liên Xô, coi quan hệ với Liên Xô là hòn đá tảng trong chính sách đối ngoại của Việt Nam” được xác định vào giai đoạn","choices":["1945-1954.","1954-1975.","1975-1985.","1986-1996."],"correct":["C"],"warning":null},{"uid":"ch3-45","set":"ch3","sourceNo":45,"question":"Năm quan điểm cơ bản chỉ đạo quá trình phát triển văn hoá trong thời kỳ công nghiệp hoá, hiện đại hoá đất nước được đưa ra tại","choices":["Đại hội lần thứ VII (1991).","Đại hội lần thứ VIII (1996).","Hội nghị Trung ương 5 (Khoá VIII, 7-1998).","Đại hội lần thứ IX (2001)."],"correct":["C"],"warning":null},{"uid":"ch3-46","set":"ch3","sourceNo":46,"question":"Hội nghị Ban chấp hành Trung ương Đảng đề ra chủ trương hoàn 63,"question":"Nghị quyết số 13 của Bộ Chính trị (khóa VI), đánh dấu sự chuyển hướng toàn bộ chiến lược đối ngoại của Đảng, đặt nền móng hình thành đướng lối đối ngoại","choices":["tự lực tự cường, rộng mở, linh hoạt hình thức và bước đi quan hệ đối ngoại.","độc lập tự chủ, rộng mở, đa dạng hóa, đa phương hóa quan hệ đối ngoại.","độc lập dân tộc, hữu nghị và hợp tác, nhiều hình thức trong quan hệ đối ngoại.","dân chủ, rộng mở, hợp tác nhiều mặt bình đẳng, cùng có lợi."],"correct":["B"],"warning":null},{"uid":"ch3-64","set":"ch3","sourceNo":64,"question":"Đại hội của Đảng đề ra chủ trương về đối ngoại: “Hợp tác bình đẳng và cùng có lợi với tất cả các nước, không phân biệt chế độ chính trị - xã hội, trên cơ sở các nguyên tắc cùng tôn trọng hòa bình” là","choices":["Đại hội VI.","Đại hội VII.","Đại hội VIII.","Đại hội IX."],"correct":["B"],"warning":null},{"uid":"ch3-65","set":"ch3","sourceNo":65,"question":"Đại hội IX của Đảng (4/2001), nhấn mạnh chủ trương về kinh tế đối ngoại là","choices":["chủ động hội nhập kinh tế quốc tế và khu vực theo tinh thần tranh thủ tối đa nguồn lực bên ngoài.","chủ động hội nhập kinh tế quốc tế và khu vực theo tinh thần tranh thủ tối đa viện trợ quốc tế.","chủ động hội nhập kinh tế quốc tế và khu vực theo tinh thần phát huy tối đa nội lực.","chủ động hội hập kinh tế quốc tế theo tinh thần đa phương hóa, đa dạng hóa quan hệ."],"correct":["C"],"warning":null},{"uid":"ch3-66","set":"ch3","sourceNo":66,"question":"Quan điểm: “Mục tiêu đến giữa thế kỷ XXI, toàn Đảng, toàn dân ta phải ra sức phấn đấu xây dựng nước ta trở thành một nước công nghiệp hiện đại, theo định hướng xã hội chủ nghĩa” được đưa ra tại","choices":["Đại hội VIII.","Đại hội IX.","Đại hội X.","Đại hội XI."],"correct":["D"],"warning":null},{"uid":"ch3-67","set":"ch3","sourceNo":67,"question":"“Đoàn kết - Dân chủ - Kỷ cương - Đổi mới” là chủ đề của","choices":["Đại hội IX.","Đại hội X.","Đại hội XI.","Đại hội XII."],"correct":["D"],"warning":null},{"uid":"ch3-68","set":"ch3","s }
function go(newPage){state.page=newPage;render();window.scrollTo(0,0)}
function act(action,value){switch(action){case 'home':go('home');break;case 'bank':go('bank');break;case 'focus-setup':document.querySelector('#study-setup')?.scrollIntoView({behavior:'smooth'});break;case 'set':state.set=value;render();document.querySelector('#study-setup')?.scrollIntoView();break;case 'set-start':state.set=value;startQuiz();break;case 'mode':state.mode=value;render();document.querySelector('#study-setup')?.scrollIntoView();break;case 'start':startQuiz();break;case 'resume':if(session&&!session.completed)go('quiz');else notice('Không có bài đang làm để tiếp tục.');break;case 'past-result':if(session&&session.completed)go('results');else notice('Chưa có kết quả để xem.');break;case 'answer':answer(value);break;case 'prev':session.current=Math.max(0,session.current-1);save();render();window.scrollTo(0,0);break;case 'next':session.current=Math.min(session.ids.length-1,session.current+1);save();render();window.scrollTo(0,0);break;case 'goto':session.current=parseInt(value,10);save();render();window.scrollTo(0,0);break;case 'bookmark':user.bookmarks=user.bookmarks.includes(value)?user.bookmarks.filter(id=>id!==value):[...user.bookmarks,value];save();render();break;case 'finish':finish();break;case 'filter':state.filter=value;render();document.querySelector('.reviews')?.scrollIntoView();break;case 'retry-wrong':{let list=session.ids.filter(id=>{const q=get(id),ans=session.answers[id];return ans!=null&&q.correct.length&&!equals(q,ans)});if(!list.length){notice('Không có câu sai nào trong lượt này.');return}session={ids:list,current:0,answers:{},mode:'practice',startedAt:Date.now(),completed:false,elapsed:0,finishedAt:null};save();go('quiz');break}case 'new-quiz':session=null;save();go('home');document.querySelector('#study-setup')?.scrollIntoView();break;case 'download-result':toCSV();break;case 'print':window.print();break;case 'bank-reveal':state.bankReveal=!state.bankReveal;render();break;case 'bank-prev':state.bankPage=Math.max(0,state.bankPage-1);render();window.scrollTo(0,0);break;case 'bank-next':state.bankPage++;render();window.scrollTo(0,0);break;case 'theme':user.dark=!user.dark;save();setTheme();break;}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;act(button.dataset.action,button.dataset.value)});
document.addEventListener('change',event=>{if(event.target.id==='bank-set'){state.bankSet=event.target.value;state.bankPage=0;render()}if(event.target.id==='amount')state.count=event.target.value;if(event.target.id==='random-order')state.shuffle=event.target.checked});
document.addEventListener('input',event=>{if(event.target.id==='bank-search'){let caret=event.target.selectionStart;state.search=event.target.value;state.bankPage=0;renderBank();const input=document.getElementById('bank-search');input?.focus();input?.setSelectionRange(caret,caret)}});
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select')||event.ctrlKey||event.altKey||event.metaKey)return;if(state.page==='quiz'&&session){if(['1','2','3','4'].includes(event.key)){answer(LABELS[parseInt(event.key)-1]);event.preventDefault()}else if(event.key==='ArrowRight'&&session.current<session.ids.length-1){act('next');event.preventDefault()}else if(event.key==='ArrowLeft'&&session.current>0){act('prev');event.preventDefault()}}});
setInterval(()=>{if(state.page==='quiz'&&session&&!session.completed){const t=document.getElementById('elapsed');if(t)t.textContent=fmtTime(Date.now()-session.startedAt)}},1000);
if(session&&!session.completed)state.page='home';render();
</script>
</body>
</html>
